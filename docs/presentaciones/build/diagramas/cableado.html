  <rect x="60" y="720" width="1480" height="140" rx="12" fill="#f8f8f6" stroke="#ddd" stroke-width="2"/>

  <text x="90" y="795" font-size="20" fill="#444">• Negativo común al chasis · cables de señal apantallados con malla a GND solo en la caja · etiquetar cada cable en ambos extremos</text>
  <text x="90" y="828" font-size="20" fill="#444">• El shunt de 150 Ω nunca se abre con el lazo energizado · prensaestopas hacia abajo · antenas fuera de la caja metálica</text>
