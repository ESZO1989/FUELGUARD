<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Calibri,Arial,sans-serif}</style></head><body>
<svg width="1600" height="760" viewBox="0 0 1600 760" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs><marker id="f" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 z" fill="#1c5cab"/></marker></defs>
  <!-- tanque cisterna -->
  <rect x="60" y="120" width="420" height="260" rx="60" fill="#dfe8f5" stroke="#1c5cab" stroke-width="5"/>
  <text x="270" y="200" text-anchor="middle" font-size="34" font-weight="700" fill="#0b2a66">TANQUE CISTERNA</text>
  <text x="270" y="245" text-anchor="middle" font-size="26" fill="#334">10 000 L</text>
  <!-- sensor de nivel -->
  <rect x="250" y="70" width="40" height="60" fill="#ec835a"/>
  <line x1="270" y1="130" x2="270" y2="360" stroke="#ec835a" stroke-width="6" stroke-dasharray="10 8"/>
  <circle cx="270" cy="365" r="14" fill="#ec835a"/>
  <text x="300" y="100" font-size="24" font-weight="700" fill="#b5532c">① Sensor de nivel 4–20 mA</text>
  <text x="300" y="128" font-size="20" fill="#555">por la boca de inspección, hasta el fondo</text>
  <!-- salida -->
  <line x1="480" y1="300" x2="560" y2="300" stroke="#1c5cab" stroke-width="10"/>
  <!-- bomba -->
  <circle cx="620" cy="300" r="58" fill="#f4f5f2" stroke="#1c5cab" stroke-width="5"/>
  <text x="620" y="292" text-anchor="middle" font-size="22" font-weight="700" fill="#0b2a66">BOMBA</text>
  <text x="620" y="320" text-anchor="middle" font-size="18" fill="#555">existente</text>
  <line x1="678" y1="300" x2="740" y2="300" stroke="#1c5cab" stroke-width="10"/>
  <!-- filtro -->
  <rect x="740" y="262" width="90" height="76" rx="10" fill="#f4f5f2" stroke="#1c5cab" stroke-width="5"/>
  <text x="785" y="308" text-anchor="middle" font-size="20" font-weight="700" fill="#0b2a66">FILTRO</text>
  <line x1="830" y1="300" x2="900" y2="300" stroke="#1c5cab" stroke-width="10" marker-end="url(#f)"/>
  <!-- caudalímetro NUEVO -->
  <rect x="905" y="240" width="170" height="120" rx="14" fill="#fff3ea" stroke="#ec835a" stroke-width="6"/>
  <text x="990" y="285" text-anchor="middle" font-size="22" font-weight="700" fill="#b5532c">② CAUDALÍMETRO</text>
  <text x="990" y="315" text-anchor="middle" font-size="18" fill="#555">de pulsos 1½"</text>
  <text x="990" y="340" text-anchor="middle" font-size="18" fill="#555">respetar flecha de flujo</text>
  <line x1="1075" y1="300" x2="1130" y2="300" stroke="#1c5cab" stroke-width="10" marker-end="url(#f)"/>
  <!-- electroválvula NUEVA -->
  <rect x="1135" y="240" width="170" height="120" rx="14" fill="#fff3ea" stroke="#ec835a" stroke-width="6"/>
  <text x="1220" y="285" text-anchor="middle" font-size="22" font-weight="700" fill="#b5532c">③ ELECTROVÁLVULA</text>
  <text x="1220" y="315" text-anchor="middle" font-size="18" fill="#555">NC 1½" · 12/24 V</text>
  <text x="1220" y="340" text-anchor="middle" font-size="18" fill="#555">solo abre con tag válido</text>
  <line x1="1305" y1="300" x2="1360" y2="300" stroke="#1c5cab" stroke-width="10"/>
  <!-- carrete / manguera -->
  <circle cx="1420" cy="300" r="50" fill="#f4f5f2" stroke="#1c5cab" stroke-width="5"/>
  <text x="1420" y="294" text-anchor="middle" font-size="18" font-weight="700" fill="#0b2a66">CARRETE</text>
  <text x="1420" y="318" text-anchor="middle" font-size="16" fill="#555">manguera</text>
  <path d="M1440 345 C 1480 420, 1380 470, 1300 520 S 1200 600, 1130 610" fill="none" stroke="#1c5cab" stroke-width="10"/>
  <!-- pistola -->
  <rect x="1010" y="585" width="120" height="50" rx="8" fill="#f4f5f2" stroke="#1c5cab" stroke-width="5"/>
  <rect x="940" y="600" width="72" height="22" fill="#1c5cab"/>
  <text x="1070" y="618" text-anchor="middle" font-size="18" font-weight="700" fill="#0b2a66">PISTOLA</text>
  <!-- antena RFID -->
  <ellipse cx="950" cy="611" rx="26" ry="20" fill="none" stroke="#ec835a" stroke-width="6"/>
  <text x="1290" y="690" text-anchor="middle" font-size="22" font-weight="700" fill="#b5532c">④ Antena RFID en la boquilla</text>
  <text x="1290" y="718" text-anchor="middle" font-size="18" fill="#555">2–3 cm del tag · resina epóxica</text><line x1="975" y1="625" x2="1160" y2="680" stroke="#ec835a" stroke-width="3" stroke-dasharray="6 6"/>
  <!-- tanque del equipo -->
  <rect x="660" y="570" width="170" height="110" rx="12" fill="#e9f5ec" stroke="#1fb51f" stroke-width="5"/>
  <rect x="820" y="590" width="40" height="34" fill="#1fb51f"/>
  <text x="745" y="615" text-anchor="middle" font-size="20" font-weight="700" fill="#0a6f0a">TANQUE DEL</text>
  <text x="745" y="642" text-anchor="middle" font-size="20" font-weight="700" fill="#0a6f0a">EQUIPO</text>
  <text x="745" y="720" text-anchor="middle" font-size="22" font-weight="700" fill="#0a6f0a">⑤ Tag RFID anti‑metal en el cuello</text>
  <!-- caja controlador -->
  <rect x="60" y="480" width="330" height="200" rx="14" fill="#f4f5f2" stroke="#1c5cab" stroke-width="5"/>
  <text x="225" y="525" text-anchor="middle" font-size="24" font-weight="700" fill="#0b2a66">⑥ CAJA CONTROLADOR IP67</text>
  <text x="225" y="560" text-anchor="middle" font-size="18" fill="#555">ESP32 + 4G + GPS · relé · fuente 5 V</text>
  <text x="225" y="590" text-anchor="middle" font-size="18" fill="#555">alimentación 12/24 V con fusible 3 A</text>
  <text x="225" y="620" text-anchor="middle" font-size="18" fill="#555">antenas LTE y GPS en el techo de cabina</text>
  <text x="225" y="655" text-anchor="middle" font-size="18" fill="#555">cables: nivel · pulsos · válvula · RFID</text>
  <!-- cables punteados -->
  <path d="M390 560 C 700 560, 800 420, 990 365" fill="none" stroke="#888" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M390 580 C 800 600, 1000 420, 1220 365" fill="none" stroke="#888" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M250 480 C 250 440, 265 420, 270 380" fill="none" stroke="#888" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M390 640 C 600 720, 800 700, 940 640" fill="none" stroke="#888" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="620" y="440" font-size="18" fill="#777">— — cableado apantallado a la caja</text>
  <!-- leyenda -->
  <rect x="1330" y="60" width="230" height="110" rx="10" fill="#fff" stroke="#ccc" stroke-width="2"/>
  <rect x="1345" y="78" width="26" height="18" fill="#fff3ea" stroke="#ec835a" stroke-width="3"/><text x="1380" y="93" font-size="18" fill="#333">Nuevo (kit FuelGuard)</text>
  <rect x="1345" y="110" width="26" height="18" fill="#f4f5f2" stroke="#1c5cab" stroke-width="3"/><text x="1380" y="125" font-size="18" fill="#333">Existente en el camión</text>
  <rect x="1345" y="142" width="26" height="18" fill="#e9f5ec" stroke="#1fb51f" stroke-width="3"/><text x="1380" y="157" font-size="18" fill="#333">En cada equipo</text>
</svg></body></html>
