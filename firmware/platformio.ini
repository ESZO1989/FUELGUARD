; FuelGuard – firmware del controlador embarcado en el camión cisterna (ESP32)
;
;   pio run -e esp32-wifi     -t upload   ; banco de pruebas / obra con WiFi
;   pio run -e esp32-sim7600  -t upload   ; producción con módem 4G SIM7600 (GPS integrado)
;   pio device monitor -b 115200
;
; Edite include/config.h antes de compilar (clave del dispositivo, servidor, pines, K-factor).

[platformio]
default_envs = esp32-wifi
src_dir = src
include_dir = include

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DTINY_GSM_RX_BUFFER=1024
lib_deps =
  bblanchon/ArduinoJson@^7.1.0
  arduino-libraries/ArduinoHttpClient@^0.6.1
  vshymanskyy/TinyGSM@^0.12.0

[env:esp32-wifi]
build_flags =
  ${env.build_flags}
  -DNET_WIFI=1

[env:esp32-sim7600]
build_flags =
  ${env.build_flags}
  -DNET_WIFI=0
  -DTINY_GSM_MODEM_SIM7600
